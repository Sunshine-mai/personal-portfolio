server:
  port: ${SERVER_PORT:2001}

spring:
  application:
    name: personal-portfolio-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/personal_portfolio?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:portfolio_app}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    baseline-on-migrate: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

sa-token:
  token-name: portfolio-token
  is-concurrent: false
  is-share: false
